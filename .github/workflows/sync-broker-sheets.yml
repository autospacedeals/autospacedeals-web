name: Sync broker Google Sheets

# Manual trigger for /api/cron/sync-sheets (Actions tab → Run workflow).
# The every-30-minutes schedule now runs from Supabase (pg_cron — see
# supabase/migrations/0019_schedule_cron_jobs.sql): GitHub's free scheduler
# delayed and skipped runs, and running both could overlap two syncs.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-sheets endpoint
        run: |
          curl --fail-with-body --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.CRON_SYNC_SECRET }}" \
            "https://www.idriveus.com/api/cron/sync-sheets"
