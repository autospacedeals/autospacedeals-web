name: Send saved-search alerts

# Hits the site's /api/cron/search-alerts endpoint every hour, which emails
# customers about newly posted deals matching their saved searches (see
# app/api/cron/search-alerts/route.ts). Runs on GitHub's free scheduler for
# the same reason as sync-broker-sheets.yml (Vercel's Hobby plan only allows
# once-a-day cron schedules), and uses the same CRON_SYNC_SECRET. Scheduled
# at :17 rather than on the hour, when GitHub's scheduler is busiest and
# most likely to delay a run. Also runnable manually from the Actions tab
# for testing.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call search-alerts endpoint
        run: |
          curl --fail-with-body --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.CRON_SYNC_SECRET }}" \
            "https://www.idriveus.com/api/cron/search-alerts"
