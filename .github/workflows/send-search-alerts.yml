name: Send saved-search alerts

# Manual trigger for /api/cron/search-alerts (Actions tab → Run workflow),
# which emails customers about newly posted deals matching their saved
# searches (see app/api/cron/search-alerts/route.ts). The hourly schedule
# now runs from Supabase (pg_cron — see
# supabase/migrations/0019_schedule_cron_jobs.sql) so it isn't delayed by
# GitHub's scheduler and can't overlap a scheduled run.
on:
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call search-alerts endpoint
        run: |
          curl --fail-with-body --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.CRON_SYNC_SECRET }}" \
            "https://www.idriveus.com/api/cron/search-alerts"
